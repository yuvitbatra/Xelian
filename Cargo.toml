[workspace]
resolver = "2"
members = ["crates/xelian-cli", "crates/xelian-core"]

[workspace.package]
# Must match the release tag being built: `xelian --version` reports this, and
# the release workflow refuses to publish a tag that disagrees with it. Bump it
# in the same commit you tag.
version = "0.1.7"
edition = "2021"
license = "MIT"

# Release binaries ship to users, so optimize for size and strip symbols
# (Perf #4). LTO + a single codegen unit shrink the single static binary.
[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
xelian-core = { path = "crates/xelian-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
ignore = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
semver = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
rpassword = "7"
tiny_http = "0.12"
